name: Deploy staging

# Manual only — this touches real AWS resources and costs real money
# while running, unlike every other workflow in this repository.
# The AWS-only staging edge extends the original API/Worker/Temporal stack
# with a private S3 console behind CloudFront's AWS-managed HTTPS hostname,
# Cognito OIDC, and HTTP API. It deliberately uses no custom domain and
# still carries only synthetic demo data.
on:
  workflow_dispatch: {}

# id-token: write is what lets this workflow assume an AWS IAM role via
# OIDC federation — no long-lived AWS access key is stored in this
# repository at any point, in any secret. attestations: write is what
# lets it record a real SBOM + build provenance attestation (GitHub's
# own Sigstore-backed attestation store) for the exact image digest
# that gets deployed - Charter Section 29 item 6's last open piece,
# supply-chain evidence for the immutable image tags M7-021 already
# established.
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false # Never cancel a deploy mid-flight — a half-applied Terraform run is a worse state than a queued one waiting its turn.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` here on purpose — a GitHub Environment changes
    # the OIDC sub claim to "repo:OWNER/REPO:environment:NAME" instead
    # of the branch-ref form terraform/bootstrap/oidc.tf's trust policy
    # checks. Adding one later (for required-reviewer approval gates)
    # is a real Phase 2 hardening step, not free to bolt on without
    # also updating that trust policy to match.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Repository variables (Settings -> Secrets and variables ->
      # Actions -> Variables), set once from terraform/bootstrap's own
      # outputs — none of these are secrets, they're identifiers, which
      # is exactly why they're `vars.*` and not `secrets.*`.
      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: terraform/staging
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      # A first-ever deploy has no ECR repository yet - it's a resource the
      # real terraform apply below would normally create, but the image
      # push step right after this one needs somewhere to push to first.
      # This used to be solved with `terraform apply -target=...`, which
      # is explicitly what Terraform's own docs warn isn't for routine
      # use - running a targeted apply and a full apply back to back in
      # the same run produced a real, confusing "Cycle" error on an
      # otherwise-correct dependency graph. Doing the idempotent
      # create-if-missing with a plain AWS CLI call, entirely outside
      # Terraform's own state and graph, avoids that class of problem -
      # the only thing Terraform does with this resource is the one real
      # import below (a state-only operation, not a partial apply).
      - name: Ensure the ECR repository exists (plain AWS CLI, outside Terraform, so the image push below has somewhere to push to)
        run: |
          if aws ecr describe-repositories --region "${{ vars.AWS_REGION }}" \
              --repository-names mortgage-agent >/dev/null 2>&1; then
            echo "ECR repository already exists."
          else
            aws ecr create-repository --region "${{ vars.AWS_REGION }}" \
              --repository-name mortgage-agent --image-tag-mutability IMMUTABLE
          fi

      - name: Import the ECR repository into Terraform state if it isn't tracked yet
        working-directory: terraform/staging
        run: |
          if terraform state show aws_ecr_repository.app >/dev/null 2>&1; then
            echo "Already tracked in state."
          else
            terraform import \
              -var="aws_region=${{ vars.AWS_REGION }}" \
              -var="image_tag=${{ github.sha }}" \
              aws_ecr_repository.app mortgage-agent
          fi

      # Login unconditionally, before the build/push-or-skip branch below
      # - the pull step right after this one needs a real ECR session
      # regardless of which branch runs, including the "already exists,
      # skip build/push" one.
      - name: Log in to ECR
        env:
          ECR_REPOSITORY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$ECR_REPOSITORY"

      - name: Build and push the image (tagged with this commit's SHA - never "latest")
        env:
          ECR_REPOSITORY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent
        run: |
          # The repository has IMMUTABLE tags on purpose (real supply-chain
          # protection - a tag can never be silently overwritten once
          # pushed). That means re-running this workflow for a commit
          # whose image was already pushed (routine while iterating on
          # unrelated Terraform/IAM fixes with no new commit) must not
          # try to push it again - ECR would correctly refuse that.
          if aws ecr describe-images --region "${{ vars.AWS_REGION }}" \
              --repository-name mortgage-agent --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "Image for ${{ github.sha }} already exists in ECR - skipping build/push."
          else
            docker build -t "$ECR_REPOSITORY:${{ github.sha }}" .
            docker push "$ECR_REPOSITORY:${{ github.sha }}"
          fi

      # Always pull, even on the "already exists, skip build/push" path
      # above - the image is guaranteed to be in the runner's local
      # Docker daemon either way, which is what the SBOM step below and
      # the digest lookup both need, without requiring separate registry
      # credentials for either.
      - name: Pull the image so its real digest and contents are available locally
        id: image
        env:
          ECR_REPOSITORY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent
        run: |
          docker pull "$ECR_REPOSITORY:${{ github.sha }}"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$ECR_REPOSITORY:${{ github.sha }}" | cut -d'@' -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Real image digest: $digest"

      - name: Generate a real SBOM for the exact deployed image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      # GitHub's own Sigstore-backed attestation store - tied to this
      # exact image digest, not the mutable tag. Not pushed to ECR
      # itself (push-to-registry): ECR's OCI-referrers support for this
      # is unverified from here, and gh attestation verify below reads
      # from GitHub's store either way, which is guaranteed to work.
      - name: Attest build provenance for this exact image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent
          subject-digest: ${{ steps.image.outputs.digest }}

      # Not actions/attest-sbom: it exited 0 in a real run here but the
      # attestation it claimed to create was never actually retrievable
      # (a real `gh attestation verify` right after found only the
      # provenance one, not this one) - and it prints its own
      # deprecation notice pointing at this exact replacement.
      # actions/attest is the current, non-deprecated action; SBOM mode
      # is selected automatically by supplying sbom-path.
      - name: Attest the real SBOM for this exact image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.spdx.json

      # The real check - an attestation the action "succeeded" at
      # creating is not the same as one that actually verifies. This
      # pulls both attestations back from GitHub's real attestation API
      # and cryptographically verifies them against the real pushed
      # image, the same way anyone downloading this image later could.
      #
      # Both explicit --predicate-type flags are required, not optional:
      # `gh attestation verify` only checks https://slsa.dev/provenance/v1
      # by default (confirmed in its own --help text) and silently
      # ignores every other attestation on the same subject unless you
      # ask for that predicate type explicitly - a real first-run mystery
      # here (the SBOM attestation had a real Rekor log entry and a real
      # GitHub attestation URL the whole time; a raw `gh api
      # repos/.../attestations/<digest>` call proved it was always
      # retrievable) that a retry loop alone never would have fixed. The
      # exact SBOM predicate-type string was read off that raw API
      # response, not guessed: https://spdx.dev/Document/v2.3.
      - name: Really verify both attestations against the pushed image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_ref="oci://${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/mortgage-agent@${{ steps.image.outputs.digest }}"
          echo "Verifying build provenance..."
          gh attestation verify "$image_ref" --owner ${{ github.repository_owner }} \
            --predicate-type https://slsa.dev/provenance/v1
          echo "Verifying the SBOM..."
          gh attestation verify "$image_ref" --owner ${{ github.repository_owner }} \
            --predicate-type https://spdx.dev/Document/v2.3
          echo "Confirmed: both a real build-provenance attestation and a real SBOM attestation verify against this exact image digest."

      - name: terraform apply
        working-directory: terraform/staging
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="image_tag=${{ github.sha }}"
        # A migration failure (see ecs.tf's null_resource.migrate) fails
        # this step directly — Terraform never proceeds to update
        # api/worker with a schema they don't match.

      # The console is a static, private S3 origin behind CloudFront. Its API
      # calls deliberately remain relative (`/v1`, `/graphql`), so browser
      # sessions stay first-party on the AWS-managed CloudFront hostname and
      # no provider token or backend URL enters the Vite bundle.
      - name: Build and publish the synthetic operations console
        working-directory: terraform/staging
        run: |
          npm --prefix ../../console ci --include=dev
          VITE_API_URL= VITE_GRAPHQL_URL=/graphql npm --prefix ../../console run build
          console_bucket=$(terraform output -raw console_bucket_name)
          distribution_id=$(terraform output -raw cloudfront_distribution_id)
          aws s3 sync ../../console/dist "s3://$console_bucket" \
            --delete --exclude 'index.html' \
            --cache-control 'public,max-age=31536000,immutable'
          aws s3 cp ../../console/dist/index.html "s3://$console_bucket/index.html" \
            --cache-control 'no-store' --content-type 'text/html'
          aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths '/*'

      # The real verification step. A clean `terraform apply` proves
      # the infrastructure exists; it does not prove the new deploy is
      # actually serving traffic. This does.
      - name: Verify the deployed API is actually serving
        working-directory: terraform/staging
        run: |
          alb_dns=$(terraform output -raw alb_dns_name)
          echo "Checking http://$alb_dns/health/ready ..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://$alb_dns/health/ready" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Real 200 from the deployed staging API."
              exit 0
            fi
            sleep 10
          done
          echo "Staging API never returned a real 200 from /health/ready" >&2
          exit 1

      - name: Verify the public HTTPS console edge is serving
        working-directory: terraform/staging
        run: |
          console_url=$(terraform output -raw console_url)
          echo "Checking $console_url/health/ready ..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$console_url/health/ready" || echo "000")
            if [ "$status" = "200" ]; then
              echo "Real 200 from the AWS-managed HTTPS edge."
              exit 0
            fi
            sleep 10
          done
          echo "CloudFront edge never returned a real 200 from /health/ready" >&2
          exit 1
