name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t mortgage-integration-agent:ci .

  postgres-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mortgage_agent
          POSTGRES_USER: mortgage
          POSTGRES_PASSWORD: mortgage_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mortgage -d mortgage_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mortgage:mortgage_ci@localhost:5432/mortgage_agent
      DEMO_MODE: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm run migration:run
      - run: npm run test:e2e -- --runInBand
