services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mortgage_agent
      POSTGRES_USER: mortgage
      POSTGRES_PASSWORD: mortgage_demo
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mortgage -d mortgage_agent']
      interval: 5s
      timeout: 5s
      retries: 5

  # Temporal development service (Section 19.1): auto-setup runs its own
  # schema migration against the same Postgres server on first boot, into
  # separate `temporal`/`temporal_visibility` databases — it never touches
  # the app's own mortgage_agent database.
  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: mortgage
      POSTGRES_PWD: mortgage_demo
      POSTGRES_SEEDS: postgres
    ports:
      - '7233:7233'
    depends_on:
      postgres:
        condition: service_healthy

  # Self-hosted OIDC issuer (Section 16.1: "OIDC/OAuth 2.0 for people",
  # M5-024) — start-dev's own embedded dev database, not the app's
  # Postgres server: this is a local-only convenience service (Section 19's
  # real target is a managed OIDC provider), so provisioning a second
  # persistent datastore for it would be ceremony with no real deployment
  # counterpart. --import-realm loads keycloak/realm-export.json on first
  # boot: a real realm, a public client (`mortgage-agent-app`, direct
  # access grants enabled for curl-based local testing without a browser),
  # and one real test user.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ['start-dev', '--import-realm']
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://mortgage:mortgage_demo@postgres:5432/mortgage_agent
      DECISION_PROVIDER: ${DECISION_PROVIDER:-rules}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:9b}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-60000}
      TEMPORAL_ADDRESS: temporal:7233
      OIDC_ISSUER_URL: http://keycloak:8080/realms/mortgage-agent
      OIDC_AUDIENCE: mortgage-agent-app
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      keycloak:
        condition: service_started

  worker:
    build: .
    command: ['node', 'dist/worker']
    environment:
      DATABASE_URL: postgres://mortgage:mortgage_demo@postgres:5432/mortgage_agent
      TEMPORAL_ADDRESS: temporal:7233
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
